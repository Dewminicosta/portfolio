services:
  # Backend Service
  - type: web
    name: portfolio-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: PORT
        value: 5000

  # Frontend Service
  - type: web
    name: portfolio-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-backend.onrender.com/api
    headers:
      - source: /**
        headers:
          - key: Cache-Control
            value: no-cache
